<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" width="100%" height="100%">
  <defs>
    <!-- Gradiente dos Anéis e Hastes -->
    <linearGradient id="glowRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0265c7" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Gradiente da Palavra CLUB -->
    <linearGradient id="clubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Gradiente 3D das Esferas -->
    <radialGradient id="sphereGrad" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#e0f7fe" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#03457e" />
    </radialGradient>

    <!-- Gradiente do Traço de Brilho Inferior -->
    <linearGradient id="flareGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Filtro de Glow Suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== MOLÉCULA / ÍCONE ==================== -->
  <g id="molecule-group" filter="url(#softGlow)">
    <!-- Hastes das Esferas -->
    <!-- Haste Esfera Superior (Anel Direito) -->
    <line x1="235" y1="28" x2="235" y2="13" stroke="url(#glowRingGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Haste Esfera Superior-Direita (Anel Direito) -->
    <line x1="265" y1="46" x2="283" y2="34" stroke="url(#glowRingGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Haste Esfera Inferior-Esquerda (Anel Esquerdo) -->
    <line x1="145" y1="78" x2="125" y2="89" stroke="url(#glowRingGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Anel Esquerdo (Hexágono com paredes verticais) -->
    <polygon points="175,28 145,46 145,78 175,96 205,78 205,46" 
      fill="none" stroke="url(#glowRingGrad)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Ligações Duplas Anel Esquerdo -->
    <line x1="151" y1="50" x2="173" y2="36" stroke="url(#glowRingGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="151" y1="52" x2="151" y2="72" stroke="url(#glowRingGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="177" y1="88" x2="199" y2="75" stroke="url(#glowRingGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Anel Direito (Hexágono fundido) -->
    <polygon points="235,28 265,46 265,78 235,96 205,78 205,46" 
      fill="none" stroke="url(#glowRingGrad)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Ligações Duplas Anel Direito -->
    <line x1="211" y1="52" x2="211" y2="72" stroke="url(#glowRingGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="237" y1="36" x2="259" y2="50" stroke="url(#glowRingGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="259" y1="74" x2="237" y2="88" stroke="url(#glowRingGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Esferas 3D com Brilho Specular -->
    <!-- Esfera Superior -->
    <circle cx="235" cy="11" r="7.5" fill="url(#sphereGrad)" stroke="#0284c7" stroke-width="0.8" />
    <!-- Esfera Superior-Direita -->
    <circle cx="286" cy="32" r="7" fill="url(#sphereGrad)" stroke="#0284c7" stroke-width="0.8" />
    <!-- Esfera Inferior-Esquerda -->
    <circle cx="122" cy="91" r="7.5" fill="url(#sphereGrad)" stroke="#0284c7" stroke-width="0.8" />
  </g>

  <!-- ==================== TIPOGRAFIA DA MARCA ==================== -->
  <!-- GLOW CLUB® -->
  <g id="brand-name">
    <text x="220" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="1">
      <tspan fill="#0b1b3d">GLOW</tspan><tspan fill="url(#clubGrad)">CLUB</tspan>
      <tspan fill="#0284c7" font-size="16" font-weight="700" dy="-14">®</tspan>
    </text>
  </g>

  <!-- SUBTÍTULO: PHARMA • PERFORMANCE -->
  <g id="brand-subtitle">
    <text x="220" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" letter-spacing="4.5" fill="#1e293b">
      PHARMA <tspan fill="#0284c7" font-weight="900">•</tspan> PERFORMANCE
    </text>
  </g>

  <!-- LINHA DE BRILHO HORIZONTAL INFERIOR -->
  <g id="glow-flare-line">
    <line x1="90" y1="168" x2="350" y2="168" stroke="url(#flareGrad)" stroke-width="1.8" />
    <line x1="160" y1="168" x2="280" y2="168" stroke="url(#flareGrad)" stroke-width="3" />
    <!-- Ponto focal central de luz -->
    <ellipse cx="220" cy="168" rx="8" ry="1.5" fill="#e0f2fe" opacity="0.9" />
  </g>
</svg>
